name: hivemaster

networks:
  hm-backend:

services:
  keycloak-db:
    image: postgres:16
    ports:
      - 5432:5432
    environment:
      LC_ALL: C.UTF-8
      POSTGRES_DB: hivemaster
      POSTGRES_USER: keycloakservice
      POSTGRES_PASSWORD: keycloakservice
      POSTGRES_PORT: 5432
    networks:
      - hm-backend

  hivemaster-iam:
    image: hivemaster-iam
    depends_on:
      - keycloak-db
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        DOCKER_BUILDKIT: 0
    ports:
      - 8888:8888
      - 8080:8080
      - 8443:8443
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: keycloakservice
      KC_DB_PASSWORD: keycloakservice
      KC_DB_SCHEMA: public
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/hivemaster
      KC_DB_URL_PROPERTIES: ?useSSL=false&allowPublicKeyRetrieval=true

      # Uncomment when in production
      KEYCLOAK_ADMIN: keycloak.admin
      KEYCLOAK_ADMIN_PASSWORD: keycloak.admin

      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_FEATURES: token-exchange

      DEBUG_PORT: 8888
      PROXY_ADDRESS_FORWARDING: 'true'

      KC_LOG_CONSOLE_LEVEL: DEBUG
      KC_LOG_LEVEL: com.hivemaster:DEBUG,feign:DEBUG

      IAM_SERVICES_URL: http://192.168.68.62:8081
    networks:
      - hm-backend

name: hivemaster

networks:
  hm-backend:

services:
  hivemaster-iam:
    image: hivemaster-iam
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        DOCKER_BUILDKIT: 0
    ports:
      - 8888:8888
      - 8080:8080
      - 8443:8443
    environment:
      KC_DB: postgres
      KC_DB_USERNAME: keycloakservice
      KC_DB_PASSWORD: keycloakservice
      KC_DB_SCHEMA: keycloakservice
      KC_DB_URL: jdbc:postgresql://host.docker.internal:5432/hivemaster
      KC_DB_URL_PROPERTIES: ?useSSL=false&allowPublicKeyRetrieval=true

      # Uncomment when in production
      KEYCLOAK_ADMIN: keycloak.admin
      KEYCLOAK_ADMIN_PASSWORD: keycloak.admin

      KC_HOSTNAME_STRICT: false
      KC_HEALTH_ENABLED: true
      KC_METRICS_ENABLED: true
      KC_FEATURES: token-exchange

      DEBUG_PORT: 8888
      PROXY_ADDRESS_FORWARDING: 'true'

      KC_LOG_CONSOLE_LEVEL: DEBUG
      KC_LOG_LEVEL: com.hivemaster:DEBUG,feign:DEBUG

      IAM_SERVICES_URL: http://host.docker.internal:8081
